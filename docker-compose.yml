version: '3.8'

services:
  # MySQL Database Service
  mysql_db:
    image: mysql:8.0
    container_name: recruitment_ats_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: recruitment_ats_db
      MYSQL_USER: ats_user
      MYSQL_PASSWORD: ats_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    networks:
      - ats_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot & Unified React Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruitment_ats_app
    restart: always
    depends_on:
      mysql_db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_db:3306/recruitment_ats_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ats_user
      SPRING_DATASOURCE_PASSWORD: ats_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      FILE_UPLOAD_DIR: uploads/resumes
    volumes:
      - app_uploads:/app/uploads
    networks:
      - ats_network

volumes:
  mysql_data:
  app_uploads:

networks:
  ats_network:
    driver: bridge
